[workspace]
members = ["crates/*"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
publish = false

# Versions only: each crate names the features it uses.
[workspace.dependencies]
agent = { path = "crates/agent" }
client = { path = "crates/client" }
remote = { path = "crates/remote" }
disk = { path = "crates/disk" }
fetch = { path = "crates/fetch" }
hotkeys = { path = "crates/hotkeys" }
i18n = { path = "crates/i18n" }
journal = { path = "crates/journal" }
launchers = { path = "crates/launchers" }
model = { path = "crates/model" }
overlay = { path = "crates/overlay" }
pe = { path = "crates/pe" }
play = { path = "crates/play" }
plugins = { path = "crates/plugins" }
sdk = { path = "crates/sdk" }
shell = { path = "crates/shell" }
sound = { path = "crates/sound" }
tray = { path = "crates/tray" }
updater = { path = "crates/updater" }
video = { path = "crates/video" }
wand = { path = "crates/wand" }
wine = { path = "crates/wine" }

aes = "0.8"
anyhow = "1"
async-io = "2"
async-net = "2"
async-tungstenite = { version = "0.35", default-features = false }
blocking = "1"
bytes = "1"
cbc = "0.1"
chrono = { version = "0.4", default-features = false }
embed-resource = "3"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
form_urlencoded = "1"
futures = "0.3"
getrandom = "0.4"
gpui-kit = "=0.9.1"
h2 = "0.4"
httparse = "1"
http = "1"
image = { version = "0.25", default-features = false }
log = "0.4"
markdown = "1.0.0"
raw-window-handle = "0.6"
rustc-hash = "2"
unicode-segmentation = "1"
qrcodegen = "1.8"
rusty-leveldb = "4.0.2"
semver = "1"
rust-embed = "8"
serde = "1"
proc-macro2 = "1"
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
ts-rs = "12"
tao = "0.37.2"
tokio = "1"
ttf-parser = "0.25"
unic-langid = "0.9"
ureq = "3.5.2"
url = "2"
uuid = "1"
wasmi = { version = "2.0.1", default-features = false }
wat = "1.263"
webview2-com = "0.39"
windows = "0.62"
windows-registry = "0.6"
windows-sys = "0.61"
wry = "0.57.2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Every crate opts in with `[lints] workspace = true`; `scripts/check.ps1` denies warnings.
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Logs go through `journal`.
print_stdout = "warn"
print_stderr = "warn"
# Skips drops: a live trainer would stay in the game.
exit = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

# Unoptimized GPUI and image decoding make debug builds too slow to judge the UI.
[profile.dev.package."*"]
opt-level = 2

# Whole-program inlining across crates: faster and smaller, for a longer build.
[profile.release]
lto = "thin"
codegen-units = 1
